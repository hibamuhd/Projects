[project]
name = "glanceflow-ai"
version = "0.1.0"
description = "Independent portfolio prototype: agentic personal discovery and action engine (synthetic data)."
requires-python = ">=3.10"
dependencies = ["streamlit>=1.40", "pydantic>=2.5", "pandas>=2.0", "numpy>=1.26", "plotly>=5.20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
